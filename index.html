<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="0.1.2">
<meta name="theme-color" content="#2f4a3a">
<title>Rangitata Barn</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f3f1ec; --card:#ffffff; --ink:#1f2620; --muted:#6b7268; --line:#dcd8cf;
  --brand:#2f4a3a; --brand-ink:#ffffff; --accent:#c98a2b; --ok:#2e7d4f; --warn:#b7791f; --bad:#b23a2e;
  --ok-bg:#e5f2ea; --warn-bg:#fbf0dc; --bad-bg:#f7e2df; --chip:#ece9e2; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141815; --card:#1d221e; --ink:#e8ebe6; --muted:#9aa197; --line:#323a33;
    --brand:#3d6150; --ok-bg:#1d3326; --warn-bg:#3a2f1a; --bad-bg:#3b211e; --chip:#2a302b; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:10px 16px calc(10px) 16px;padding-top:max(10px,env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.htitle{font-weight:700;font-size:18px}
.hsub{font-size:13px;opacity:.85}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.18);white-space:nowrap;border:0;color:inherit}
main{padding:12px 16px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-height:56px;border:0;background:none;color:var(--muted);font:600 13px system-ui,sans-serif}
nav button.on{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
@media (prefers-color-scheme: dark){ nav button.on{color:#8fc0a6;box-shadow:inset 0 3px 0 #8fc0a6} }
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 12px}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
h3{font-size:17px;margin:0 0 6px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:600 14px system-ui,sans-serif}
.seg button.on.clean{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button.on.target{background:var(--chip);border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.seg button.on.heavy{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 14px system-ui,sans-serif}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.alert{border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.alert.warn{background:var(--warn-bg)} .alert.bad{background:var(--bad-bg)} .alert.ok{background:var(--ok-bg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase}
tr.total td{font-weight:700;border-top:2px solid var(--line)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.big{font-size:28px;font-weight:700}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;min-height:44px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px system-ui,sans-serif}
textarea{min-height:70px;resize:vertical}
.pen{border-top:1px solid var(--line);padding:12px 0}
.pen:first-of-type{border-top:0;padding-top:0}
.feedin{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;margin:6px 0}
.feedin input{text-align:right}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal h3{font-size:19px}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.list-item{padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.datebar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.datebar input{flex:1}
.saved-note{font-size:13px;color:var(--ok);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div>
      <div class="htitle">Rangitata Barn</div>
      <div class="hsub" id="h-sub">-</div>
    </div>
    <button class="pill" id="sync-pill" onclick="syncNow()">Local only</button>
  </div>
</header>

<main>
  <section class="view on" id="view-today"></section>
  <section class="view" id="view-pens"></section>
  <section class="view" id="view-health"></section>
  <section class="view" id="view-tally"></section>
  <section class="view" id="view-settings"></section>
</main>

<nav>
  <button data-tab="today" class="on" onclick="showTab('today')">Feed</button>
  <button data-tab="pens" onclick="showTab('pens')">Pens</button>
  <button data-tab="health" onclick="showTab('health')">Health</button>
  <button data-tab="tally" onclick="showTab('tally')">Tally</button>
  <button data-tab="settings" onclick="showTab('settings')">Settings</button>
</nav>

<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>

<script>
const APP_VERSION = '0.1.2';
const LS_RECORDS = 'pfebarn_records_v1';
const LS_PENDING = 'pfebarn_pending_v1';
const LS_SETTINGS = 'pfebarn_settings_v1';
const SEED_TS = '2026-11-18T00:00:00.000Z';

const FEEDS = ['silage','straw','corn','pellets'];
const FEED_NAMES = {silage:'Grass silage', straw:'Wheat straw', corn:'Corn', pellets:'Protein pellets'};
// kg as fed per head per day, Delimax feed plan (Rob Earl, 19 Oct 2026) — same values as feed-log/build_weekly.py
const RATIONS = [
  {name:'Calf 1', days:7,  kg:{silage:2.3800000000000008, straw:0.16091954022988508, corn:0, pellets:2.7056179775280893}},
  {name:'Calf 2', days:7,  kg:{silage:0.72000000000000397, straw:0.18390804597701149, corn:0, pellets:3.991011235955054}},
  {name:'Veal 1', days:35, kg:{silage:0, straw:0.35172413793103446, corn:0, pellets:5.386516853932584}}, // straw lifted 4% -> 6% DM (22 Nov 2026)
  {name:'Veal 2', days:35, kg:{silage:0, straw:0.2804597701149425, corn:1.6547126436781607, pellets:4.9622471910112349}},
  {name:'Veal 3', days:35, kg:{silage:0, straw:0.32643678160919537, corn:3.1501149425287363, pellets:4.5791011235955041}},
  {name:'Veal 4', days:35, kg:{silage:0, straw:0.3724137931034483, corn:4.9903448275862052, pellets:3.858876404494382}},
];
const BUNK = {clean:'Licked clean', target:'~10% left', heavy:'Lots left'};
const SIGNS = ['Scours','Coughing / breathing','Off feed','Lame','Bloat','Navel / joint','Dull / flat','Other'];
const CAUSES = ['Scours','Pneumonia','Bloat','Injury','Put down','Found dead - unknown','Other'];
const HEALTH_TYPES = {sick:'Sick', treated:'Treated', isolation:'To isolation', recovered:'Recovered', dead:'Dead'};
const LIFT_STEP = 5;

/* ---------- storage ---------- */
let memStore = {};
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return memStore[k]??null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){memStore[k]=v;}}
function lsJSON(k,fb){try{const v=lsGet(k);return v?JSON.parse(v):fb;}catch(e){return fb;}}

let records = lsJSON(LS_RECORDS, {});
let pending = new Set(lsJSON(LS_PENDING, []));
let settings = Object.assign({endpoint:'', user:'Katrina'}, lsJSON(LS_SETTINGS, {}));
let syncState = {status:'idle', last:null, error:''};
let currentTab = 'today';
let feedDate = todayStr();
let draft = null;
let healthFilter = 'open';
let tallyPeriod = 'thisweek';

function persist(){ lsSet(LS_RECORDS, JSON.stringify(records)); lsSet(LS_PENDING, JSON.stringify([...pending])); }
function saveSettings(){ lsSet(LS_SETTINGS, JSON.stringify(settings)); }

/* ---------- dates ---------- */
function pad(n){return String(n).padStart(2,'0');}
function localDayStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return localDayStr(new Date());}
function parseDay(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parseDay(s);d.setDate(d.getDate()+n);return localDayStr(d);}
function daysBetween(a,b){return Math.round((parseDay(b)-parseDay(a))/86400000);}
function fmtDay(s){if(!s)return '';return parseDay(s).toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short'});}
function mondayOf(s){const d=parseDay(s);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return localDayStr(d);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ---------- numbers ---------- */
function r5(x){return Math.round(x/5)*5;}
function fmtKg(x){return Math.round(x).toLocaleString('en-NZ');}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- records ---------- */
function live(kind){return Object.values(records).filter(r=>r.kind===kind&&!r.deleted);}
function putRecord(kind,id,date,body){
  const rec={id,kind,date:date||'',body,updatedAt:new Date().toISOString(),deleted:false};
  records[id]=rec; pending.add(id); persist(); schedulePush(); return rec;
}
function deleteRecord(id){
  const r=records[id]; if(!r)return;
  records[id]=Object.assign({},r,{deleted:true,updatedAt:new Date().toISOString()});
  pending.add(id); persist(); schedulePush();
}

// Seed records use fixed ids and fixed old timestamps, and are only added when the id is absent,
// so a seed can never overwrite a real edit or revive a deleted record (tombstones keep the id).
const SEED_SETS=[
  {ts:SEED_TS, note:'Opening count (pen-heads.json, 2 Nov 2026)',
   pens:[['Pen 1',1],['Pen 2',2],['Pen 3',3],['Pen 4',4],['Pen 5',5],['Pen 6',6]].map(([n,o])=>[n,o,'2026-10-26','pens1-6']),
   moves:[['seed-1','Pen 1','2026-10-20',80],['seed-2','Pen 2','2026-10-20',80],['seed-3','Pen 3','2026-10-28',80],['seed-4','Pen 4','2026-10-28',23],['seed-5','Pen 4','2026-10-30',57],['seed-6','Pen 5','2026-10-30',80],['seed-7','Pen 6','2026-10-30',34]]},
  {ts:'2026-11-18T00:00:01.000Z', note:'NAIT arrivals 4/10/11 Nov, 843 on site (Brendon, 18 Nov 2026)',
   pens:[['Pen 7',7],['Pen 8',8],['Pen 9',9],['Pen 10',10],['Pen 11',11]].map(([n,o])=>[n,o,'2026-11-09','pens7-11']),
   moves:[['seed2-1','Pen 7','2026-11-04',58],['seed2-2','Pen 7','2026-11-10',22],['seed2-3','Pen 8','2026-11-10',80],['seed2-4','Pen 9','2026-11-10',12],['seed2-5','Pen 9','2026-11-11',68],['seed2-6','Pen 10','2026-11-11',80],['seed2-7','Pen 11','2026-11-11',89]]},
];
function seedIfEmpty(){
  let added=false;
  const add=(kind,id,date,body,ts)=>{if(records[id])return;records[id]={id,kind,date,body,updatedAt:ts,deleted:false};pending.add(id);added=true;};
  SEED_SETS.forEach(s=>{
    s.pens.forEach(([name,order,dayOne,batch])=>add('pen','pen:'+name,dayOne,{name,order,dayOne,batch,active:true},s.ts));
    s.moves.forEach(([id,pen,date,head])=>add('move','move:'+id,date,{pen,date,type:'in',head,note:s.note},s.ts));
  });
  if(added)persist();
}

/* ---------- model ---------- */
function pens(includeInactive){
  return live('pen').map(r=>r.body).filter(p=>includeInactive||p.active!==false).sort((a,b)=>(a.order||0)-(b.order||0));
}
function penHead(pen,date){
  let h=0;
  live('move').forEach(r=>{const m=r.body; if(m.date>date)return;
    if(m.type==='in'&&m.pen===pen)h+=+m.head||0;
    if(m.type==='out'&&m.pen===pen)h-=+m.head||0;
    if(m.type==='transfer'){if(m.pen===pen)h-=+m.head||0; if(m.toPen===pen)h+=+m.head||0;}
  });
  live('health').forEach(r=>{const e=r.body; if(e.type==='dead'&&e.pen===pen&&e.date<=date)h-=1;});
  return Math.max(0,h);
}
function totalHead(date){return pens().reduce((s,p)=>s+penHead(p.name,date),0);}
function penLift(pen,date){
  let best=null;
  live('lift').forEach(r=>{const l=r.body; if(l.pen!==pen||l.date>date)return;
    if(!best||l.date>best.date||(l.date===best.date&&r.updatedAt>best._ts))best=Object.assign({_ts:r.updatedAt},l);});
  return best?+best.pct||0:0;
}
function rationFor(dayOne,date){
  const day=daysBetween(dayOne,date)+1;
  if(day<1)return {name:'Not started',day,kg:null,nextName:RATIONS[0].name,nextDate:dayOne};
  let end=0;
  for(let i=0;i<RATIONS.length;i++){
    end+=RATIONS[i].days;
    if(day<=end){const nx=RATIONS[i+1];return {name:RATIONS[i].name,day,kg:RATIONS[i].kg,nextName:nx?nx.name:'Finish (day 154)',nextDate:addDays(dayOne,end)};}
  }
  const last=RATIONS[RATIONS.length-1];
  return {name:last.name+' (past day 154)',day,kg:last.kg,nextName:null,nextDate:null};
}

// Plan for a day: per pen kg by feed, grouped into mixer loads by ration.
function buildPlan(date){
  const penRows=[]; const loads={};
  pens().forEach(p=>{
    const head=penHead(p.name,date); const lift=penLift(p.name,date); const rat=rationFor(p.dayOne,date);
    const kg={}; FEEDS.forEach(f=>kg[f]=rat.kg?rat.kg[f]*head*(1+lift/100):0);
    const total=FEEDS.reduce((s,f)=>s+kg[f],0);
    penRows.push({pen:p.name,head,lift,ration:rat.name,day:rat.day,batch:p.batch||'',plan:kg,planTotal:total,nextName:rat.nextName,nextDate:rat.nextDate});
    if(!rat.kg||head===0)return;
    if(!loads[rat.name])loads[rat.name]={ration:rat.name,pens:[],plan:Object.fromEntries(FEEDS.map(f=>[f,0]))};
    loads[rat.name].pens.push(p.name); FEEDS.forEach(f=>loads[rat.name].plan[f]+=kg[f]);
  });
  return {date,pens:penRows,loads:Object.values(loads)};
}
function feedRecord(date){const r=records['feed:'+date];return r&&!r.deleted?r.body:null;}

/* ---------- sync ---------- */
let pushTimer=null, pushing=false, pollTimer=null;
function schedulePush(){clearTimeout(pushTimer);pushTimer=setTimeout(pushNow,3000);renderSync();}
function rowOut(r){return {id:r.id,kind:r.kind,date:r.date,body:JSON.stringify(r.body),updatedAt:r.updatedAt,deleted:!!r.deleted};}
function mergeRows(rows){
  let changed=false;
  (rows||[]).forEach(row=>{
    if(!row||!row.id)return;
    let body; try{body=JSON.parse(row.body||'{}');}catch(e){return;}
    const local=records[row.id];
    if(local&&String(local.updatedAt)>=String(row.updatedAt))return;
    records[row.id]={id:row.id,kind:row.kind,date:row.date,body,updatedAt:row.updatedAt,deleted:!!row.deleted};
    pending.delete(row.id); changed=true;
  });
  if(changed)persist();
  return changed;
}
async function pushNow(){
  if(!settings.endpoint){renderSync();return;}
  if(pushing){schedulePush();return;}
  if(!pending.size){return pullNow();}
  pushing=true; syncState.status='syncing'; renderSync();
  const sent=[...pending].map(id=>records[id]).filter(Boolean).map(rowOut);
  try{
    const res=await fetch(settings.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({rows:sent})});
    const data=await res.json();
    if(!data.ok)throw new Error(data.error||'Server said no');
    const serverIds=new Map((data.rows||[]).map(r=>[r.id,r.updatedAt]));
    sent.forEach(s=>{const cur=records[s.id]; if(cur&&cur.updatedAt===s.updatedAt&&serverIds.get(s.id)>=s.updatedAt)pending.delete(s.id);});
    persist();
    const changed=mergeRows(data.rows);
    syncState={status:pending.size?'retry':'ok',last:new Date(),error:''};
    if(changed&&!modalOpen())renderAll();
  }catch(e){syncState={status:'retry',last:syncState.last,error:String(e.message||e)};setTimeout(schedulePush,20000);}
  pushing=false; renderSync();
}
async function pullNow(){
  if(!settings.endpoint||pushing)return;
  try{
    const res=await fetch(settings.endpoint+(settings.endpoint.includes('?')?'&':'?')+'t='+Date.now());
    const data=await res.json();
    if(!data.ok)throw new Error('Bad response');
    const changed=mergeRows(data.rows);
    syncState={status:pending.size?'retry':'ok',last:new Date(),error:''};
    if(changed&&!modalOpen())renderAll();
  }catch(e){syncState={status:navigator.onLine?'retry':'offline',last:syncState.last,error:String(e.message||e)};}
  renderSync();
}
function syncNow(){ if(!settings.endpoint){showTab('settings');return;} pending.size?pushNow():pullNow(); }
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(()=>{if(document.visibilityState==='visible'&&!modalOpen())pending.size?pushNow():pullNow();},60000);}
function renderSync(){
  const el=document.getElementById('sync-pill');
  if(!settings.endpoint){el.textContent='Local only';return;}
  if(!navigator.onLine){el.textContent='Offline · saved on phone';return;}
  if(syncState.status==='syncing'){el.textContent='Syncing…';return;}
  if(pending.size){el.textContent='Saved on phone · '+(syncState.status==='retry'?'retrying':'syncing');return;}
  el.textContent=syncState.last?'Synced '+syncState.last.toLocaleTimeString('en-NZ',{hour:'numeric',minute:'2-digit'}):'Up to date';
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(pending.size)pushNow();}else{pullNow();}});
window.addEventListener('online',()=>{renderSync();pushNow();});
window.addEventListener('offline',renderSync);

/* ---------- modal ---------- */
function modalOpen(){return document.getElementById('modal-bg').classList.contains('on');}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modal-bg').classList.add('on');}
function closeModal(){document.getElementById('modal-bg').classList.remove('on');renderAll();}

/* ---------- tabs ---------- */
function showTab(t){
  currentTab=t;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='view-'+t));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  renderAll(); window.scrollTo(0,0);
}
function renderAll(){
  document.getElementById('h-sub').textContent=fmtDay(todayStr())+' · '+totalHead(todayStr())+' calves';
  ({today:renderToday,pens:renderPens,health:renderHealth,tally:renderTally,settings:renderSettings})[currentTab]();
  renderSync();
}

/* ---------- FEED (today) ---------- */
function loadDraft(date){
  const saved=feedRecord(date); const plan=buildPlan(date);
  const d={date,bunk:{},actual:{},notes:'',saved:!!saved};
  if(saved){
    Object.entries(saved.pens||{}).forEach(([p,v])=>{if(v.bunk)d.bunk[p]=v.bunk;});
    (saved.loads||[]).forEach(l=>{d.actual[l.ration]=Object.assign({},l.actualEntered||{});});
    d.notes=saved.notes||'';
  }
  plan.loads.forEach(l=>{if(!d.actual[l.ration])d.actual[l.ration]={};});
  return d;
}
function prevBunk(pen,date){const fr=feedRecord(addDays(date,-1));return fr&&fr.pens&&fr.pens[pen]?fr.pens[pen].bunk:null;}

function renderToday(){
  if(!draft||draft.date!==feedDate)draft=loadDraft(feedDate);
  const plan=buildPlan(feedDate);
  const saved=feedRecord(feedDate);
  let h=`<div class="datebar"><input type="date" value="${feedDate}" max="${todayStr()}" onchange="setFeedDate(this.value)">
    ${feedDate!==todayStr()?`<button class="btn sm" onclick="setFeedDate('${todayStr()}')">Today</button>`:''}</div>`;
  if(saved)h+=`<div class="alert ok">Saved ${esc(saved.by||'')} ${saved.savedAt?new Date(saved.savedAt).toLocaleTimeString('en-NZ',{hour:'numeric',minute:'2-digit'}):''}. You can still change it and save again.</div>`;
  else if(feedDate!==todayStr())h+=`<div class="alert warn">No feed saved for ${fmtDay(feedDate)}. Fill it in from the clipboard if you have it.</div>`;

  plan.pens.forEach(p=>{ if(p.nextDate&&p.head>0){const d=daysBetween(feedDate,p.nextDate); if(d>=0&&d<=7&&p.nextName)h+=`<div class="alert warn"><b>${esc(p.pen)}</b> moves to <b>${esc(p.nextName)}</b> on ${fmtDay(p.nextDate)}${d===0?' (today)':' (in '+d+' day'+(d===1?'':'s')+')'}.${/Veal 2/.test(p.nextName)?' Corn starts - check the corn bunks are ready.':''}</div>`;} });

  // Step 1: bunks
  h+=`<div class="card"><h2>1. Check bunks</h2><div class="small muted" style="margin:-4px 0 10px">Before feeding. Target is about 10% left.</div>`;
  plan.pens.filter(p=>p.head>0).forEach(p=>{
    const b=draft.bunk[p.pen]; const pb=prevBunk(p.pen,feedDate);
    h+=`<div class="pen"><div class="row"><h3>${esc(p.pen)}</h3><span class="small muted">${p.head} calves${p.lift?` · lift <b>+${p.lift}%</b>`:''}</span></div>
      <div class="seg">${Object.entries(BUNK).map(([k,v])=>`<button class="${k}${b===k?' on':''}" onclick="setBunk('${esc(p.pen)}','${k}')">${v}</button>`).join('')}</div>`;
    const liftedToday=live('lift').some(r=>r.body.pen===p.pen&&r.body.date===feedDate);
    if(b==='clean'&&pb==='clean'&&liftedToday)h+=`<div class="small" style="margin-top:6px;color:var(--ok);font-weight:600">Lift set today: +${p.lift}%</div>`;
    else if(b==='clean'&&pb==='clean')h+=`<div class="alert ok" style="margin:8px 0 0"><div class="row"><span>Cleaned up 2 days running.</span><button class="btn sm primary" onclick="quickLift('${esc(p.pen)}',${LIFT_STEP})">Lift +${LIFT_STEP}%</button></div></div>`;
    if(b==='heavy'&&pb==='heavy')h+=`<div class="alert warn" style="margin:8px 0 0">Feed left 2 days running. Text Brendon. Do not cut the feed without his OK.</div>`;
    h+=`</div>`;
  });
  h+=`</div>`;

  // Step 2: mixer loads
  if(!plan.loads.length)h+=`<div class="card"><div class="empty">No pens on feed for this day.</div></div>`;
  plan.loads.forEach(l=>{
    const tot=FEEDS.reduce((s,f)=>s+l.plan[f],0);
    const act=draft.actual[l.ration]||{};
    h+=`<div class="card"><h2>2. Load the mixer${plan.loads.length>1?' - '+esc(l.ration):''}</h2>
      <div class="row"><div><div class="big">${fmtKg(r5(tot))} kg</div><div class="small muted">${esc(l.ration)} · ${l.pens.map(esc).join(', ')}</div></div></div>
      <div class="small muted" style="margin:10px 0 2px">Planned kg on the left. Type what you actually loaded only if it was different.</div>`;
    FEEDS.forEach(f=>{ if(l.plan[f]<0.5)return;
      h+=`<div class="feedin"><div><b>${FEED_NAMES[f]}</b> <span class="muted">${fmtKg(r5(l.plan[f]))} kg</span></div>
        <input type="number" inputmode="decimal" placeholder="${fmtKg(r5(l.plan[f]))}" value="${act[f]??''}" oninput="setActual('${esc(l.ration)}','${f}',this.value)"></div>`;});
    h+=`</div>`;
  });

  // Step 3: drop per pen
  if(plan.loads.length){
    h+=`<div class="card"><h2>3. Drop per pen</h2><div class="tablewrap"><table><tr><th>Pen</th><th>Calves</th><th>Lift</th><th>Ration</th><th>Drop kg</th></tr>`;
    let tH=0,tK=0;
    plan.pens.filter(p=>p.head>0).forEach(p=>{tH+=p.head;tK+=p.planTotal;
      h+=`<tr><td>${esc(p.pen)}</td><td>${p.head}</td><td>${p.lift?'+'+p.lift+'%':'-'}</td><td>${esc(p.ration)}</td><td><b>${fmtKg(r5(p.planTotal))}</b></td></tr>`;});
    h+=`<tr class="total"><td>Total</td><td>${tH}</td><td></td><td></td><td>${fmtKg(r5(tK))}</td></tr></table></div></div>`;
  }

  // Step 4: save
  h+=`<div class="card"><h2>4. Save</h2><label>Notes (optional)</label><textarea oninput="draft.notes=this.value" placeholder="Anything off today - feed issue, water, machinery">${esc(draft.notes)}</textarea>
    <div style="margin-top:12px"><button class="btn primary block" onclick="saveFeed()">${saved?'Save changes':'Save today\'s feed'}</button></div></div>`;
  document.getElementById('view-today').innerHTML=h;
}
function setFeedDate(v){if(!v)return;feedDate=v;draft=null;renderToday();}
function setBunk(pen,k){draft.bunk[pen]=draft.bunk[pen]===k?undefined:k;renderToday();}
function setActual(ration,f,v){if(!draft.actual[ration])draft.actual[ration]={};if(v===''||isNaN(+v))delete draft.actual[ration][f];else draft.actual[ration][f]=+v;}
function quickLift(pen,step){
  const cur=penLift(pen,feedDate);
  putRecord('lift','lift:'+uid(),feedDate,{pen,date:feedDate,pct:cur+step,note:'Bunk licked clean 2 days running',by:settings.user});
  renderAll();
}
function saveFeed(){
  const plan=buildPlan(feedDate);
  const missing=plan.pens.filter(p=>p.head>0&&!draft.bunk[p.pen]).map(p=>p.pen);
  if(missing.length&&!confirm('No bunk score for '+missing.join(', ')+'. Save anyway?'))return;
  const loads=plan.loads.map(l=>{
    const entered=Object.assign({},draft.actual[l.ration]||{});
    const actual={}; FEEDS.forEach(f=>actual[f]=entered[f]!=null?entered[f]:r5(l.plan[f]));
    return {ration:l.ration,pens:l.pens,plan:l.plan,actual,actualEntered:entered};
  });
  const pensOut={};
  plan.pens.forEach(p=>{
    const load=loads.find(l=>l.ration===p.ration);
    const actual={}; FEEDS.forEach(f=>actual[f]=load&&load.plan[f]>0?load.actual[f]*p.plan[f]/load.plan[f]:0);
    pensOut[p.pen]={head:p.head,lift:p.lift,ration:p.ration,day:p.day,batch:p.batch,plan:p.plan,actual,bunk:draft.bunk[p.pen]||''};
  });
  putRecord('feed','feed:'+feedDate,feedDate,{date:feedDate,loads,pens:pensOut,notes:draft.notes||'',by:settings.user,savedAt:new Date().toISOString()});
  draft=null; renderAll(); window.scrollTo(0,0);
}

function saveMove(pen){

function openPenHistory(pen){
  const ev=[];
  live('move').forEach(r=>{const m=r.body; if(m.pen!==pen&&m.toPen!==pen)return;
    const lbl=m.type==='in'?`+${m.head} in`:m.type==='out'?`-${m.head} out`:(m.pen===pen?`-${m.head} to ${m.toPen}`:`+${m.head} from ${m.pen}`);
    ev.push({date:m.date,text:lbl+(m.note?' · '+m.note:''),id:r.id});});
  live('lift').forEach(r=>{const l=r.body; if(l.pen===pen)ev.push({date:l.date,text:`Lift set to ${l.pct?'+'+l.pct+'%':'none'}${l.note?' · '+l.note:''}`,id:r.id});});
  live('health').forEach(r=>{const e=r.body; if(e.pen===pen&&e.type==='dead')ev.push({date:e.date,text:`-1 died${e.tag?' ('+e.tag+')':''}`,id:null});});
  ev.sort((a,b)=>b.date.localeCompare(a.date));
  openModal(`<h3>${esc(pen)} history</h3>${ev.length?ev.map(e=>`<div class="list-item row"><div><b>${fmtDay(e.date)}</b><div class="small">${esc(e.text)}</div></div>${e.id?`<button class="btn sm danger" onclick="if(confirm('Delete this entry?')){deleteRecord('${e.id}');openPenHistory('${esc(pen)}')}">Delete</button>`:''}</div>`).join(''):'<div class="empty">Nothing yet.</div>'}
    <div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>`);
}

/* ---------- HEALTH ---------- */
function healthEvents(){return live('health').map(r=>Object.assign({_id:r.id,_ts:r.updatedAt},r.body)).sort((a,b)=>b.date.localeCompare(a.date)||b._ts.localeCompare(a._ts));}
function caseKey(e){return e.tag?e.tag.trim().toUpperCase():null;}
function openCases(){
  const last={};
  healthEvents().slice().reverse().forEach(e=>{const k=caseKey(e); if(k)last[k]=e;});
  return Object.values(last).filter(e=>['sick','treated','isolation'].includes(e.type));
}
function whpList(date){
  return healthEvents().filter(e=>e.type==='treated'&&+e.whpDays>0).map(e=>Object.assign({},e,{clear:addDays(e.date,+e.whpDays)})).filter(e=>e.clear>date);
}
function renderHealth(){
  const t=todayStr(); const ev=healthEvents(); const oc=openCases(); const whp=whpList(t);
  const deaths=ev.filter(e=>e.type==='dead');
  const d7=deaths.filter(e=>daysBetween(e.date,t)<7).length;
  let h=`<div class="grid2" style="margin-bottom:12px">

    <div class="card"><div class="grid2"><div><div class="big">${oc.length}</div><div class="small muted">open sick calves</div></div><div><div class="big">${deaths.length}</div><div class="small muted">deaths this season${d7?` · ${d7} in last 7 days`:''}</div></div></div></div>`;
  if(whp.length)h+=`<div class="card"><h2>In withholding - do not send out</h2>${whp.map(e=>`<div class="list-item row"><div><b>${esc(e.tag||'No tag')}</b> · ${esc(e.pen)}<div class="small muted">${esc(e.product||'')} on ${fmtDay(e.date)}</div></div><span class="tag warn">clear ${fmtDay(e.clear)}</span></div>`).join('')}</div>`;
  h+=`<div class="card"><h2>Open sick calves</h2>${oc.length?oc.map(e=>`<div class="list-item"><div class="row"><div><b>${esc(e.tag)}</b> · ${esc(e.pen)} <span class="tag ${e.type==='isolation'?'warn':''}">${HEALTH_TYPES[e.type]}</span><div class="small muted">${fmtDay(e.date)} · ${daysBetween(e.date,t)} days ago${(e.signs||[]).length?' · '+esc(e.signs.join(', ')):''}${e.product?' · '+esc(e.product):''}</div></div></div>
    <div class="seg" style="margin-top:8px"><button onclick="openHealthModal('treated','${esc(e.tag)}','${esc(e.pen)}')">Treat again</button><button onclick="quickRecovered('${esc(e.tag)}','${esc(e.pen)}')">Recovered</button><button onclick="openHealthModal('dead','${esc(e.tag)}','${esc(e.pen)}')">Died</button></div></div>`).join(''):'<div class="empty">None. Sick calves with a tag number show here until marked recovered.</div>'}</div>`;
  h+=`<div class="card"><h2>All health records</h2><div class="chips" style="margin-bottom:8px">${[['open','Last 14 days'],['dead','Deaths'],['all','All']].map(([k,v])=>`<button class="chip${healthFilter===k?' on':''}" onclick="healthFilter='${k}';renderHealth()">${v}</button>`).join('')}</div>`;
  const list=ev.filter(e=>healthFilter==='all'||(healthFilter==='dead'?e.type==='dead':daysBetween(e.date,t)<14));
  h+=list.length?list.map(e=>`<div class="list-item"><div class="row"><div><b>${fmtDay(e.date)}</b> · ${esc(e.pen)} · ${esc(e.tag||'No tag')} <span class="tag ${e.type==='dead'?'bad':e.type==='recovered'?'ok':''}">${HEALTH_TYPES[e.type]}</span></div><button class="btn sm" onclick="openHealthModal(null,null,null,'${e._id}')">Edit</button></div>
    <div class="small muted">${[e.cause,(e.signs||[]).join(', '),e.product&&(e.product+(e.dose?' '+e.dose:'')+(+e.whpDays?' · WHP '+e.whpDays+'d':'')),e.notes,e.by].filter(Boolean).map(esc).join(' · ')}</div></div>`).join(''):'<div class="empty">Nothing here.</div>';
  h+=`</div>`;
  document.getElementById('view-health').innerHTML=h;
}

  toggleHealthFields();

function saveHealth(){
  const type=document.getElementById('hm-type').value; const tag=document.getElementById('hm-tag').value.trim();
  const d=document.getElementById('hm-date').value||todayStr(); const pen=document.getElementById('hm-pen').value;
  if(type!=='dead'&&!tag)return alert('Add the ear tag so the calf can be followed up');
  if(type==='dead'&&!window._hm.id&&penHead(pen,d)<1)return alert(pen+' has no calves on '+fmtDay(d));
  const body={date:d,pen,tag,type,notes:document.getElementById('hm-notes').value.trim(),by:settings.user};
  if(type==='dead')body.cause=window._hm.cause;
  else if(type!=='recovered'){body.signs=[...window._hm.signs];body.product=document.getElementById('hm-product').value.trim();body.dose=document.getElementById('hm-dose').value.trim();body.whpDays=+document.getElementById('hm-whp').value||0;
    if(body.product&&body.type==='sick')body.type='treated';}
  putRecord('health',window._hm.id||'health:'+uid(),d,body); closeModal();
}

/* ---------- TALLY ---------- */
function periodRange(){
  const t=todayStr(); const feeds=live('feed').map(r=>r.body.date).sort();
  if(tallyPeriod==='thisweek'){const m=mondayOf(t);return [m,t,'This week (from Mon '+fmtDay(m)+')'];}
  if(tallyPeriod==='lastweek'){const m=addDays(mondayOf(t),-7);return [m,addDays(m,6),'Last week ('+fmtDay(m)+' - '+fmtDay(addDays(m,6))+')'];}
  const s=feeds[0]||t; return [s,t,'Season to date (from '+fmtDay(s)+')'];
}
function tallyData(from,to){
  const days=[]; for(let d=from;d<=to;d=addDays(d,1))days.push(d);
  const act=Object.fromEntries(FEEDS.map(f=>[f,0])), pl=Object.fromEntries(FEEDS.map(f=>[f,0]));
  const byPen={}; let calfDays=0; const missing=[]; const rows=[];
  days.forEach(d=>{
    const fr=feedRecord(d);
    if(!fr){ if(totalHead(d)>0)missing.push(d); return; }
    let dayAct=0, dayPl=0, head=0;
    Object.entries(fr.pens||{}).forEach(([p,v])=>{
      if(!byPen[p])byPen[p]={kg:0,plan:0,calfDays:0,clean:0,heavy:0,scored:0};
      const a=FEEDS.reduce((s,f)=>s+(v.actual?.[f]||0),0), b=FEEDS.reduce((s,f)=>s+(v.plan?.[f]||0),0);
      byPen[p].kg+=a; byPen[p].plan+=b; byPen[p].calfDays+=v.head||0;
      if(v.bunk){byPen[p].scored++; if(v.bunk==='clean')byPen[p].clean++; if(v.bunk==='heavy')byPen[p].heavy++;}
      head+=v.head||0; calfDays+=v.head||0;
    });
    (fr.loads||[]).forEach(l=>FEEDS.forEach(f=>{act[f]+=l.actual?.[f]||0; pl[f]+=l.plan?.[f]||0; dayAct+=l.actual?.[f]||0; dayPl+=l.plan?.[f]||0;}));
    rows.push({d,head,act:dayAct,plan:dayPl,by:fr.by,notes:fr.notes});
  });
  const ev=healthEvents().filter(e=>e.date>=from&&e.date<=to);
  return {days,act,pl,byPen,calfDays,missing,rows,deaths:ev.filter(e=>e.type==='dead'),sick:ev.filter(e=>e.type==='sick'||e.type==='treated')};
}
function renderTally(){
  const [from,to,label]=periodRange(); const T=tallyData(from,to);
  const totA=FEEDS.reduce((s,f)=>s+T.act[f],0), totP=FEEDS.reduce((s,f)=>s+T.pl[f],0);
  let h=`<div class="chips" style="margin-bottom:12px">${[['thisweek','This week'],['lastweek','Last week'],['season','Season']].map(([k,v])=>`<button class="chip${tallyPeriod===k?' on':''}" onclick="tallyPeriod='${k}';renderTally()">${v}</button>`).join('')}</div>
    <div class="card"><h2>${esc(label)}</h2><div class="grid2"><div><div class="big">${fmtKg(totA)}</div><div class="small muted">kg fed (plan ${fmtKg(totP)})</div></div>
    <div><div class="big">${T.calfDays?(totA/T.calfDays).toFixed(2):'-'}</div><div class="small muted">kg/calf/day · ${fmtKg(T.calfDays)} calf-days</div></div></div>
    ${T.missing.length?`<div class="alert warn" style="margin-top:10px">No feed saved for ${T.missing.length} day${T.missing.length>1?'s':''}: ${T.missing.map(fmtDay).join(', ')}</div>`:''}</div>`;
  h+=`<div class="card"><h2>By feed</h2><div class="tablewrap"><table><tr><th>Feed</th><th>Fed kg</th><th>Plan kg</th><th>Diff</th></tr>
    ${FEEDS.filter(f=>T.act[f]||T.pl[f]).map(f=>`<tr><td>${FEED_NAMES[f]}</td><td>${fmtKg(T.act[f])}</td><td>${fmtKg(T.pl[f])}</td><td>${fmtDiff(T.act[f]-T.pl[f])}</td></tr>`).join('')}
    <tr class="total"><td>Total</td><td>${fmtKg(totA)}</td><td>${fmtKg(totP)}</td><td>${fmtDiff(totA-totP)}</td></tr></table></div>
    <div class="small muted" style="margin-top:6px">Plan = Delimax feed plan x calves, before any lift. Silage and straw are PFE's - Rob bills off these.</div></div>`;
  const pk=Object.keys(T.byPen).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  h+=`<div class="card"><h2>By pen</h2>${pk.length?`<div class="tablewrap"><table><tr><th>Pen</th><th>Fed kg</th><th>kg/calf/d</th><th>Clean</th><th>Left</th></tr>
    ${pk.map(p=>{const v=T.byPen[p];return `<tr><td>${esc(p)}</td><td>${fmtKg(v.kg)}</td><td>${v.calfDays?(v.kg/v.calfDays).toFixed(2):'-'}</td><td>${v.clean}/${v.scored}</td><td>${v.heavy}/${v.scored}</td></tr>`;}).join('')}</table></div>
    <div class="small muted" style="margin-top:6px">Clean / Left = days the bunk was licked clean / had lots left, out of days scored.</div>`:'<div class="empty">No feed saved in this period.</div>'}</div>`;
  h+=`<div class="card"><h2>Health</h2><div class="grid2"><div><div class="big">${T.deaths.length}</div><div class="small muted">deaths</div></div><div><div class="big">${T.sick.length}</div><div class="small muted">sick / treated records</div></div></div>
    ${T.deaths.length?`<div class="small muted" style="margin-top:8px">${T.deaths.map(e=>`${fmtDay(e.date)} ${esc(e.pen)}${e.cause?' ('+esc(e.cause)+')':''}`).join(' · ')}</div>`:''}</div>`;
  h+=`<div class="card"><h2>Day by day</h2>${T.rows.length?`<div class="tablewrap"><table><tr><th>Day</th><th>Calves</th><th>Fed kg</th><th>Plan kg</th><th>By</th></tr>
    ${T.rows.slice().reverse().map(r=>`<tr><td><a href="#" onclick="feedDate='${r.d}';draft=null;showTab('today');return false">${fmtDay(r.d)}</a></td><td>${r.head}</td><td>${fmtKg(r.act)}</td><td>${fmtKg(r.plan)}</td><td>${esc(r.by||'')}</td></tr>`).join('')}</table></div>`:'<div class="empty">No feed saved in this period.</div>'}
    <button class="btn block" style="margin-top:12px" onclick="exportCsv('${from}','${to}')">Download feed log (CSV)</button></div>`;
  document.getElementById('view-tally').innerHTML=h;
}
function fmtDiff(x){const r=Math.round(x);return (r>0?'+':'')+r.toLocaleString('en-NZ');}
// One row per day per feed group, same columns as ai-brain feed-log/feed-log.csv (build_weekly.py input).
function csvRows(from,to){
  const out=[];
  live('feed').map(r=>r.body).filter(b=>b.date>=from&&b.date<=to).sort((a,b)=>a.date.localeCompare(b.date)).forEach(fr=>{
    const groups={};
    Object.entries(fr.pens||{}).forEach(([p,v])=>{
      if(!v.head)return; const g=v.batch||'barn';
      if(!groups[g])groups[g]={ration:new Set(),kg:Object.fromEntries(FEEDS.map(f=>[f,0])),head:0,bunk:[],lift:[]};
      const G=groups[g]; G.ration.add(v.ration); G.head+=v.head; FEEDS.forEach(f=>G.kg[f]+=v.actual?.[f]||0);
      if(v.bunk)G.bunk.push(p.replace('Pen ','P')+' '+v.bunk); if(v.lift)G.lift.push(p.replace('Pen ','P')+' +'+v.lift);
    });
    Object.entries(groups).forEach(([g,G])=>out.push([fr.date,g,[...G.ration].join('/'),...FEEDS.map(f=>Math.round(G.kg[f])),G.head,G.bunk.join('; '),G.lift.join('; '),fr.notes||'',fr.by||'']));
  });
  return out;
}
function exportCsv(from,to){
  const head=['date','batch','ration','silage_kg','straw_kg','corn_kg','pellets_kg','head','bunk','rate_up_pct','notes','initials'];
  const q=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const text=[head,...csvRows(from,to)].map(r=>r.map(q).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));
  a.download='barn-feed-log-'+from+'-to-'+to+'.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---------- SETTINGS ---------- */
function renderSettings(){
  const names=['Katrina','Brendon','Henry','Relief feeder'];
  document.getElementById('view-settings').innerHTML=`<div class="card"><h2>Who is using this phone</h2>
    <div class="chips">${names.map(n=>`<button class="chip${settings.user===n?' on':''}" onclick="settings.user='${n}';saveSettings();renderSettings()">${n}</button>`).join('')}</div>
    <div class="small muted" style="margin-top:8px">Your name goes on every record you save.</div></div>
    <div class="card"><h2>Sync</h2><label>Sync endpoint (Apps Script /exec URL)</label><input id="st-ep" value="${esc(settings.endpoint)}" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="actions"><button class="btn primary" onclick="saveEndpoint()">Save</button><button class="btn" onclick="syncNow()">Sync now</button></div>
    <div class="small muted" style="margin-top:8px">${settings.endpoint?`${pending.size} change${pending.size===1?'':'s'} waiting to sync.${syncState.error?' Last error: '+esc(syncState.error):''}`:'Not connected. Everything is saved on this phone only.'}</div></div>
    <div class="card"><h2>Feed plan in use</h2><div class="tablewrap"><table><tr><th>Ration</th><th>Days</th><th>Silage</th><th>Straw</th><th>Corn</th><th>Pellets</th><th>Total</th></tr>
    ${(()=>{let s=0;return RATIONS.map(r=>{const a=s+1;s+=r.days;return `<tr><td>${r.name}</td><td>${a}-${s}</td>${FEEDS.map(f=>`<td>${r.kg[f]?r.kg[f].toFixed(2):'-'}</td>`).join('')}<td>${FEEDS.reduce((t,f)=>t+r.kg[f],0).toFixed(2)}</td></tr>`;}).join('');})()}</table></div>
    <div class="small muted" style="margin-top:6px">kg as fed per calf per day. Delimax feed plan, Rob Earl, 19 Oct 2026.</div></div>
    <div class="card small muted">Rangitata Barn v${APP_VERSION} · NAIT 13103088 · Calves owned by Delimax NZ</div>`;
}
function saveEndpoint(){
  const v=document.getElementById('st-ep').value.trim();
  if(v&&!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(v))return alert('That does not look like an Apps Script /exec URL');
  settings.endpoint=v; saveSettings(); syncState={status:'idle',last:null,error:''};
  if(v){pullNow().then(()=>{if(pending.size)pushNow();});startPolling();}
  renderAll();
}

/* ---------- boot ---------- */
seedIfEmpty();
renderAll();
if(settings.endpoint){pullNow().then(()=>{if(pending.size)pushNow();});startPolling();}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
